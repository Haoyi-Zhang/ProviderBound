name: Scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-scientific-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record available JVM tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/p010-scientific/toolchain"
          java -version > "$RUNNER_TEMP/p010-scientific/toolchain/java.txt" 2>&1
          javac -version > "$RUNNER_TEMP/p010-scientific/toolchain/javac.txt" 2>&1
      - name: Run the full fresh campaign from standalone artifact root
        shell: bash
        run: |
          python -B scripts/reproduce.py --output "$RUNNER_TEMP/p010-scientific/results" --java
      - name: Upload raw results and logs, including failed stages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p010-scientific-results
          path: ${{ runner.temp }}/p010-scientific
          if-no-files-found: error
          retention-days: 14
